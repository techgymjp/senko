<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="description" content="縁側で楽しむ線香花火ゲーム。火玉がぽたりと落ちた瞬間、空中でタップ。">
<title>線香花火</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060d;
    --ink: #f4e6c8;
    --ink-dim: rgba(244, 230, 200, .62);
    --fire: #ffb347;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hud { pointer-events: none; z-index: 1; }
  .ov {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px; text-align: center; box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 50%, rgba(5,6,13,.15), rgba(5,6,13,.72) 75%);
    transition: opacity .8s ease; z-index: 2;
  }
  .ov.hidden { opacity: 0; pointer-events: none; }
  h1 {
    margin: 0; font-weight: 700; font-size: clamp(44px, 12vw, 96px); letter-spacing: .32em; padding-left: .32em;
    color: #ffe8c2;
    text-shadow: 0 0 18px rgba(255, 140, 50, .75), 0 0 48px rgba(255, 90, 20, .45);
    animation: breathe 3.2s ease-in-out infinite;
  }
  h2 { margin: 0; font-size: clamp(32px, 8vw, 56px); letter-spacing: .3em; padding-left: .3em; font-weight: 700;
    text-shadow: 0 0 18px rgba(255, 140, 50, .6); }
  @keyframes breathe { 50% { text-shadow: 0 0 26px rgba(255, 160, 60, .95), 0 0 70px rgba(255, 90, 20, .55); } }
  .sub { margin: 0; line-height: 2; font-size: clamp(15px, 4vw, 19px); letter-spacing: .08em; text-shadow: 0 1px 8px #000; }
  .sub em { font-style: normal; color: var(--fire); }
  .note { margin: 0; font-size: 13px; color: var(--ink-dim); letter-spacing: .06em; max-width: 30em; line-height: 1.8; text-shadow: 0 1px 6px #000; }
  button.main {
    font: inherit; font-size: 20px; font-weight: 700; letter-spacing: .3em; padding: 14px 34px 14px calc(34px + .3em);
    color: #2a1204; background: linear-gradient(180deg, #ffd38a, #ff8a3a);
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 0 24px rgba(255, 130, 40, .55), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.main:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(255, 150, 60, .8), inset 0 1px 0 rgba(255,255,255,.5); }
  button.main:active { transform: scale(.97); }
  button.main:disabled { opacity: .5; cursor: wait; }
  .result { display: flex; gap: 28px; align-items: baseline; justify-content: center; }
  .result div { display: flex; flex-direction: column; gap: 4px; }
  .result small { font-size: 13px; color: var(--ink-dim); letter-spacing: .2em; }
  .result b { font-size: clamp(34px, 9vw, 52px); color: #ffe2b0; text-shadow: 0 0 14px rgba(255,140,50,.6); font-variant-numeric: tabular-nums; }
  .result .best b { font-size: clamp(22px, 6vw, 30px); color: var(--ink-dim); text-shadow: none; }
  #newBest { color: var(--fire); font-size: 15px; letter-spacing: .2em; min-height: 1em; margin: -6px 0 0; }
  #mute {
    position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(244,230,200,.25);
    background: rgba(5,6,13,.4); color: var(--ink-dim); font-size: 16px; cursor: pointer; font-family: inherit;
  }
  #lang {
    position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 3;
    height: 40px; min-width: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid rgba(244,230,200,.25);
    background: rgba(5,6,13,.4); color: var(--ink-dim); font-size: 13px; cursor: pointer; font-family: inherit; letter-spacing: .08em;
  }
  .caption { margin: -8px 0 0; font-size: 12px; letter-spacing: .16em; color: var(--ink-dim); text-transform: uppercase; }
  .caption:empty { display: none; }
  html[lang="en"] h2 { letter-spacing: .12em; padding-left: .12em; }
  html[lang="en"] button.main { letter-spacing: .14em; padding-left: calc(34px + .14em); }
  html[lang="en"] .sub { letter-spacing: .02em; line-height: 1.8; }
  .tagline { margin: 0; font-size: clamp(17px, 4.6vw, 22px); letter-spacing: .14em; text-shadow: 0 1px 8px #000; }
  .bestLine { margin: 0; font-size: 16px; letter-spacing: .14em; color: var(--ink-dim); min-height: 1.2em; }
  .btns { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 6px; }
  button.ghost {
    font: inherit; font-size: 17px; letter-spacing: .2em; padding: 11px 30px 11px calc(30px + .2em);
    color: var(--ink); background: rgba(5,6,13,.45); border: 1px solid rgba(244,230,200,.35); border-radius: 999px; cursor: pointer;
  }
  html[lang="en"] button.ghost { letter-spacing: .08em; padding-left: calc(30px + .08em); }
  .rules { margin: 0; padding: 0 0 0 1.3em; max-width: 26em; text-align: left; line-height: 1.85; font-size: clamp(15px, 4vw, 17px); text-shadow: 0 1px 6px #000; }
  .rules li { margin: 0 0 6px; }
  .rules em { font-style: normal; color: var(--fire); }
  #contNote, #contUsed, #shareMsg { margin: 0; font-size: 14px; color: var(--ink-dim); letter-spacing: .06em; min-height: 1.2em; }
  #legal {
    position: fixed; left: 0; right: 0; bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px)); z-index: 3;
    text-align: center; font-size: 12px; color: var(--ink-dim); letter-spacing: .04em;
  }
  #legal a { color: var(--ink-dim); margin: 0 6px; }
  #pauseBtn {
    position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); z-index: 3;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(244,230,200,.25); background: rgba(5,6,13,.4); cursor: pointer;
  }
  #pauseBtn::before, #pauseBtn::after { content: ''; position: absolute; top: 13px; width: 4px; height: 14px; background: var(--ink-dim); border-radius: 1px; }
  #pauseBtn::before { left: 14px; } #pauseBtn::after { right: 14px; }
  /* 画面ごとに出すもの */
  body:not([data-screen="play"]) #pauseBtn { display: none; }
  body:not([data-screen="title"]) #legal { display: none; }
  body:not([data-screen="title"]):not([data-screen="over"]) #lang { display: none; }
  /* アプリではバナー広告(高さ 50)と重ならないよう、下のボタンを上げる */
  body.native #lang, body.native #mute { bottom: max(62px, calc(env(safe-area-inset-bottom) + 50px)); }
  body.native #legal { bottom: max(112px, calc(env(safe-area-inset-bottom) + 100px)); }
  @media (max-height: 620px) { .rules { font-size: 14px; line-height: 1.6; } h2 { font-size: 30px; } }
  #err { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 16px; text-align: center; z-index: 5; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body data-screen="title">
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="title" class="ov">
  <h1>線香花火</h1>
  <p class="caption" data-i18n="caption"></p>
  <p class="tagline" data-i18n="tagline">夏の夜、縁側にて。</p>
  <p class="bestLine" id="bestLine"></p>
  <div class="btns">
    <button class="main" id="startBtn" data-i18n="play">火をつける</button>
    <button class="ghost" id="howBtn" data-i18n="howto">あそびかた</button>
  </div>
</div>

<div id="howto" class="ov hidden">
  <h2 data-i18n="howto">あそびかた</h2>
  <ol class="rules">
    <li data-i18n="rule1"></li>
    <li data-i18n="rule2"></li>
    <li data-i18n="rule3"></li>
    <li data-i18n="rule4"></li>
    <li data-i18n="rule5"></li>
  </ol>
  <div class="btns">
    <button class="main" id="howPlay" data-i18n="play">火をつける</button>
    <button class="ghost" id="howBack" data-i18n="back">もどる</button>
  </div>
</div>

<div id="pause" class="ov hidden">
  <h2 data-i18n="paused">ひと休み</h2>
  <div class="btns">
    <button class="main" id="resumeBtn" data-i18n="resume">つづける</button>
    <button class="ghost" id="pauseTitleBtn" data-i18n="toTitle">タイトルへ</button>
  </div>
</div>

<div id="cont" class="ov hidden">
  <h2 data-i18n="contTitle">もう一本？</h2>
  <p id="contNote"></p>
  <div class="btns">
    <button class="main" id="contWatch" data-i18n="contWatch">広告を見て続ける</button>
    <button class="ghost" id="contSkip"></button>
  </div>
</div>

<div id="over" class="ov hidden">
  <h2 data-i18n="over">おしまい</h2>
  <div class="result">
    <div><small data-i18n="score">得点</small><b id="finalScore">0</b></div>
    <div class="best"><small data-i18n="best">最高</small><b id="bestScore">0</b></div>
  </div>
  <p id="newBest"></p>
  <p id="contUsed"></p>
  <div class="btns">
    <button class="main" id="retryBtn" data-i18n="retry">もう一度</button>
    <button class="ghost" id="shareBtn" data-i18n="share">結果をシェア</button>
    <button class="ghost" id="overTitleBtn" data-i18n="toTitle">タイトルへ</button>
  </div>
  <p id="shareMsg"></p>
</div>

<div id="legal">
  <span id="buildInfo"></span>
  <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="privacy">プライバシーポリシー</a>
  <span id="adPrivacy" hidden>|<a href="#" id="adPrivacyLink" data-i18n="adSettings">広告の設定</a></span>
</div>

<button id="pauseBtn" aria-label="一時停止"></button>
<button id="mute" aria-label="音のオン・オフ">♪</button>
<button id="lang" aria-label="Language">EN</button>
<div id="err" data-i18n="err">このブラウザでは 3D 表示（WebGL）が使えないようです。</div>

<script src="./ads-config.js"></script>
<script src="./build-info.js"></script>
<script src="./ads.js"></script>
<script>
(() => {
  const STR = {
    ja: {
      title: '線香花火',
      desc: '縁側で楽しむ線香花火ゲーム。火玉がぽたりと落ちた瞬間、空中でタップ。',
      caption: '',
      tagline: '夏の夜、縁側にて。',
      bestLine: n => `最高 ${n} 点`,
      play: '火をつける', howto: 'あそびかた', back: 'もどる',
      rule1: '線香花火は「着火 → 牡丹 → 松葉 → 柳 → 散り菊」と移り変わり、最後に火玉が <em>ぽたり</em> と落ちます。',
      rule2: '落ちた火玉が地面につく前に、空中でタップしてください。',
      rule3: '落ちてすぐ取るほど高得点。続けて取ると得点が上がります。',
      rule4: '地面に落とすと命（右上の火玉）がひとつ減り、3つなくなるとおしまい。花火はどんどん増えます。',
      rule5: '燃えている火玉を早まって触ると、連続が途切れます。音を出して遊んでください。',
      paused: 'ひと休み', resume: 'つづける', toTitle: 'タイトルへ', pause: '一時停止',
      contTitle: 'もう一本？', contNote: '広告を見ると、命がひとつ戻って続けられます（1回だけ）',
      contWatch: '広告を見て続ける', contSkip: n => `おしまいにする（${n}）`, contLoading: '広告を読み込み中…',
      contFail: '広告を読み込めませんでした', contUsed: n => `コンティニュー ${n} 回`,
      over: 'おしまい', score: '得点', best: '最高', retry: 'もう一度',
      share: '結果をシェア', shareTitle: '線香花火', shareDialog: '結果をシェア', copied: '結果をコピーしました',
      shareText: (s, c, u) => `縁側の線香花火で ${s} 点！` + (c >= 2 ? `（最大 ${c} 連）` : '') + (u ? `［コンティニュー ${u} 回］` : '') + ' #線香花火',
      privacy: 'プライバシーポリシー', privacyUrl: 'https://techgym.jp/privacy-policy/', adSettings: '広告の設定',
      err: 'このブラウザでは 3D 表示（WebGL）が使えないようです。',
      mute: '音のオン・オフ', toggle: 'EN', toggleLabel: 'Switch to English',
      newBest: '― 自己最高 ―', maxCombo: n => `最大 ${n} 連`,
    },
    en: {
      title: 'Senko Hanabi — Japanese Sparkler',
      desc: 'A Japanese sparkler game on a summer-night veranda. Tap the glowing bead the moment it drops.',
      caption: 'Senko Hanabi · Japanese sparkler',
      tagline: 'A summer night on the veranda.',
      bestLine: n => `Best ${n}`,
      play: 'Light it', howto: 'How to play', back: 'Back',
      rule1: 'A sparkler burns through its stages — ignition, peony, pine needles, willow and falling chrysanthemum — and finally the glowing bead <em>drops</em>.',
      rule2: 'Tap the falling bead in mid-air before it hits the ground.',
      rule3: 'The sooner you catch it, the higher the score. Catch them in a row to earn more.',
      rule4: 'Dropping a bead costs a life (the beads at the top right). Lose all three and it is over. More and more sparklers appear.',
      rule5: 'Touching a bead that is still burning breaks your streak. Play with the sound on.',
      paused: 'Paused', resume: 'Resume', toTitle: 'Title', pause: 'Pause',
      contTitle: 'One more?', contNote: 'Watch an ad to get one life back and keep going (once per game).',
      contWatch: 'Watch an ad to continue', contSkip: n => `End game (${n})`, contLoading: 'Loading the ad…',
      contFail: 'The ad could not be loaded.', contUsed: n => `Continued ${n} time${n > 1 ? 's' : ''}`,
      over: 'Burnt out', score: 'Score', best: 'Best', retry: 'Play again',
      share: 'Share result', shareTitle: 'Senko Hanabi', shareDialog: 'Share result', copied: 'Result copied',
      shareText: (s, c, u) => `I scored ${s} in Senko Hanabi, the Japanese sparkler game!` + (c >= 2 ? ` (best streak ${c})` : '') + (u ? ` [continued ${u}x]` : '') + ' #SenkoHanabi',
      privacy: 'Privacy Policy', privacyUrl: 'https://techgym.jp/privacy-policy-en/', adSettings: 'Ad settings',
      err: '3D graphics (WebGL) are not available in this browser.',
      mute: 'Sound on/off', toggle: '日本語', toggleLabel: '日本語に切り替え',
      newBest: '— New best —', maxCombo: n => `Best streak: ${n}`,
    },
  };
  let lang = 'ja';
  try {
    const q = new URLSearchParams(location.search).get('lang');
    const saved = localStorage.getItem('senko-lang');
    if (q === 'ja' || q === 'en') lang = q;
    else if (saved === 'ja' || saved === 'en') lang = saved;
    else lang = (navigator.languages || [navigator.language || '']).some(l => /^ja/i.test(l)) ? 'ja' : 'en';
  } catch (e) {}
  const t = (k, ...a) => { const v = STR[lang][k]; return typeof v === 'function' ? v(...a) : v; };
  function apply() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelector('meta[name="description"]').content = t('desc');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    document.getElementById('mute').setAttribute('aria-label', t('mute'));
    document.getElementById('pauseBtn').setAttribute('aria-label', t('pause'));
    document.getElementById('privacyLink').href = t('privacyUrl');
    const b = document.getElementById('lang');
    b.textContent = t('toggle'); b.setAttribute('aria-label', t('toggleLabel'));
    window.dispatchEvent(new Event('senko-lang'));
  }
  window.SENKO_T = t;
  document.getElementById('lang').addEventListener('click', () => {
    lang = lang === 'ja' ? 'en' : 'ja';
    try { localStorage.setItem('senko-lang', lang); } catch (e) {}
    apply();
  });
  apply();
})();
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
